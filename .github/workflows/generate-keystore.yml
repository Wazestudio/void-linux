name: Generate Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate signing keystore
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret KEYSTORE_PASSWORD est manquant."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Le secret KEY_PASSWORD est manquant."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore void-linux-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias void-linux \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Void Linux, OU=Development, O=Void Linux, L=Pointe-Noire, ST=Congo, C=CG"

          chmod 600 void-linux-release.jks

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release-keystore
          path: void-linux-release.jks
          retention-days: 1