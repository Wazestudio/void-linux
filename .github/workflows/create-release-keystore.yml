name: Create Android Release Keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm that this is the first and only release key generation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-keystore:
    name: Create release signing keystore
    if: inputs.confirm
    runs-on: ubuntu-latest
    environment: release-signing

    steps:
      - name: Validate signing secrets and prevent key replacement
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::error::Une clé de publication est déjà configurée. Ne génère pas une nouvelle clé."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure KEYSTORE_PASSWORD et KEY_PASSWORD dans l'environnement release-signing."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/void-linux-release-keystore.jks"
          keytool -genkeypair \
            -noprompt \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias void-linux \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Void Linux, OU=Development, O=Void Linux, L=Pointe-Noire, ST=Congo, C=CG"
          chmod 600 "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias void-linux >/dev/null
          mkdir -p output
          cp "$keystore" output/void-linux-release-keystore.jks

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release-keystore
          path: output/void-linux-release-keystore.jks
          retention-days: 1
          if-no-files-found: error
