name: Publish Void-Linux Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:

  # =========================================================
  # JOB — Publier une release GitHub à partir de l'APK déjà build
  # =========================================================
  release:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK from latest successful apk-build
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: apk-build.yml
          workflow_conclusion: success
          branch: main
          name: void-linux-release
          path: artifacts
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé dans les artifacts"
            exit 1
          fi
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version : $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Void-Linux ${{ steps.version.outputs.version }}

            Environnement hacker tout-en-un sur Android.

            ### 📦 Contenu
            - APK signé prêt à installer
            - `SHA256SUMS.txt` pour vérification d'intégrité

            ### 🚀 Installation
            1. Télécharge l'APK ci-dessous
            2. Active « Installer des applications inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux

            ### ✅ Vérification SHA-256
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🎯 Fonctionnalités
            - 🐉 Kali Linux via proot (sans root)
            - 💻 Terminal interactif avec apt fonctionnel
            - 🪟 Émulation Windows (Wine + Box64)
            - 🧅 Navigateur .onion sécurisé avec annuaire intégré
            - 🛡️ Surveillance de sécurité en temps réel
            - 📍 Fausse position GPS

            ### 📋 Prérequis
            - Android 10+ (API 29)
            - Architecture : arm64-v8a
            - Espace libre : 4 Go minimum recommandé

            ### ⚠️ Avertissement légal
            Void-Linux est un outil éducatif et professionnel. L'utilisateur
            est seul responsable de l'usage qui en est fait. Toute utilisation
            malveillante est strictement interdite.
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}