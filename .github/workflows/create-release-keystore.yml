name: Build & Release Void-Linux APK

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:

  # =========================================================
  # JOB 1 — Build APK release signé
  # =========================================================
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: core/native/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('core/native/**/*.c', 'core/native/**/*.cpp', 'core/native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      # ----- Génération du keystore temporaire -----
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/void-release.jks"

      # ----- Build release signé -----
      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/void-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease \
            -PtargetAbi="arm64-v8a" \
            -x lint \
            -x lintVitalRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy="in-process"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ARMv7 APK
        if: ${{ env.BUILD_ARM32 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release-armv7
          path: app/build/outputs/apk/release/*.apk

  # =========================================================
  # JOB 2 — Publish GitHub Release (uniquement sur tag v*)
  # =========================================================
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: void-linux-release
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé pour la release"
            exit 1
          fi
          ls -la release/

      - name: Generate checksum
        run: |
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version : $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Void-Linux ${{ steps.version.outputs.version }}

            Environnement hacker tout-en-un sur Android.

            ### 📦 Contenu
            - APK signé pour installation directe
            - SHA256SUMS.txt pour vérification d'intégrité

            ### 🚀 Installation
            1. Télécharge `app-release.apk`
            2. Active « Installer des applications inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux

            ### ✅ Vérification du SHA-256
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🎯 Fonctionnalités principales
            - 🐉 Kali Linux via proot (sans root)
            - 💻 Terminal interactif avec apt fonctionnel
            - 🪟 Émulation Windows (Wine + Box64)
            - 🧅 Navigateur .onion sécurisé avec annuaire intégré
            - 🛡️ Surveillance de sécurité en temps réel
            - 📍 Fausse position GPS

            ### 📋 Prérequis
            - Android 10+ (API 29)
            - Architecture : arm64-v8a
            - Espace libre : 4 Go minimum recommandé

            ### ⚠️ Avertissement légal
            Void-Linux est un outil éducatif et professionnel. L'utilisateur
            est seul responsable de l'usage qui en est fait. Toute utilisation
            malveillante est strictement interdite.
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}