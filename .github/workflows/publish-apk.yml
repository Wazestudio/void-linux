name: Publish Void-Linux Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:

  release:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Récupérer l'APK arm64-v8a -----

      - name: Download ARM64 APK
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: apk-build.yml
          workflow_conclusion: success
          branch: main
          name: void-linux-release-arm64-v8a
          path: artifacts/arm64-v8a
          if_no_artifact_found: fail

      # ----- Récupérer l'APK armeabi-v7a -----
      - name: Download ARMv7 APK
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: apk-build.yml
          workflow_conclusion: success
          branch: main
          name: void-linux-release-armeabi-v7a
          path: artifacts/armeabi-v7a
          if_no_artifact_found: warn

      - name: Prepare release files
        run: |
          mkdir -p release
          # Renomme les APK pour qu'ils soient plus clairs
          if [ -f artifacts/arm64-v8a/app-release.apk ]; then
            cp artifacts/arm64-v8a/app-release.apk release/void-linux-arm64-v8a.apk
          fi
          if [ -f artifacts/armeabi-v7a/app-release.apk ]; then
            cp artifacts/armeabi-v7a/app-release.apk release/void-linux-armeabi-v7a.apk
          fi
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé dans les artifacts"
            exit 1
          fi
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version : $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Void-Linux ${{ steps.version.outputs.version }}

            Environnement hacker tout-en-un sur Android.

            ### 📦 Contenu
            - `void-linux-arm64-v8a.apk` — APK principal (recommandé)
            - `void-linux-armeabi-v7a.apk` — APK pour appareils 32 bits (compatibilité)
            - `SHA256SUMS.txt` — pour vérification d'intégrité

            ### 🚀 Installation
            1. Télécharge l'APK correspondant à ton appareil :
               - **arm64-v8a** : appareils modernes (2017+) — recommandé
               - **armeabi-v7a** : anciens appareils 32 bits
            2. Active « Installer des applications inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux

            ### ✅ Vérification SHA-256
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🎯 Fonctionnalités
            - 🐉 Kali Linux via proot (sans root)
            - 💻 Terminal interactif avec apt fonctionnel
            - 🪟 Émulation Windows (Wine + Box64)
            - 🧅 Navigateur .onion sécurisé avec annuaire intégré
            - 🛡️ Surveillance de sécurité en temps réel
            - 📍 Fausse position GPS

            ### 📋 Prérequis
            - Android 10+ (API 29)
            - Espace libre : 4 Go minimum recommandé

            ### ⚠️ Avertissement légal
            Void-Linux est un outil éducatif et professionnel. L'utilisateur
            est seul responsable de l'usage qui en est fait. Toute utilisation
            malveillante est strictement interdite.
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
