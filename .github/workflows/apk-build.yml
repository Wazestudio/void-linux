name: Build Void-Linux APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ matrix.android-abi }})
    runs-on: ubuntu-latest
    environment: release-signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - android-abi: arm64-v8a
          - android-abi: armeabi-v7a

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmake;3.22.1
            ndk;25.1.8937393

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: native/.cxx
          key: cmake-${{ runner.os }}-${{ matrix.android-abi }}-${{ hashFiles('native/src/main/cpp/**/*.c', 'native/src/main/cpp/**/*.cpp', 'native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.android-abi }}-

      - name: Generate mipmap icons
        run: |
          set -euo pipefail

          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      - name: Install PRoot packaging tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            patchelf \
            dpkg \
            curl

      - name: Prepare official Termux PRoot runtime (${{ matrix.android-abi }})
        run: |
          set -uo pipefail

          ABI="${{ matrix.android-abi }}"

          echo "Construction du runtime PRoot pour $ABI..."

          SOURCE_DIR="native/src/main/jniLibs/$ABI"
          TARGET_DIR="app/src/main/jniLibs/$ABI"

          mkdir -p "$SOURCE_DIR"
          mkdir -p "$TARGET_DIR"

          set +e
          bash tools/build-proot.sh "$ABI"
          PROOT_STATUS=$?
          set -e

          echo "Code retour build-proot.sh : $PROOT_STATUS"

          REQUIRED_LIBS=(
            "libproot.so"
            "libproot_loader.so"
            "libtalloc.so"
            "libandroid-shmem.so"
          )

          echo "Vérification du runtime généré..."

          for lib in "${REQUIRED_LIBS[@]}"; do
            if [ ! -s "$SOURCE_DIR/$lib" ]; then
              echo "::error::Bibliothèque PRoot manquante : $SOURCE_DIR/$lib"

             