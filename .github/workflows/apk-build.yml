name: Build Void-Linux APK

on:
  # Déclenchement UNIQUE et STRICTEMENT manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # CORRECTION CRITIQUE : Installation explicite de CMake et du NDK pour le compilateur C/C++ (Ninja)
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.1.8937393'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optimisation du cache pour CMake
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: native/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('native/src/main/cpp/**/*.c', 'native/src/main/cpp/**/*.cpp', 'native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      # Optimisation du cache pour l'image Docker de Termux Package Builder
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-termux-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docker-termux-${{ runner.os }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      # Installation des outils d'extraction pour le package PRoot
      - name: Install PRoot packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf dpkg curl

      - name: Build official Termux PRoot (ARM64)
        run: bash tools/build-proot.sh

      # Téléchargement et intégration du Rootfs Kali Linux dans les assets de l'application
      - name: Download and verify official Kali ARM64 rootfs
        run: bash tools/fetch-kali-rootfs.sh arm64 app/src/main/assets

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Le secret GitHub $name est absent; impossible de signer l'APK release."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/void-linux-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          {
            echo "RELEASE_STORE_FILE=$keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APKs (Debug & Release)
        run: gradle clean assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Aucun APK release généré."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/void-linux-release -name "*.apk" -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé pour la release !"
            exit 1
          fi
          for apk in release/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ github.ref_name }}
          body: |
            ## Void-Linux ${{ github.ref_name }}
            Environnement hacker tout-en-un sur Android.

            ### Contenu
            - Kali Linux via proot
            - Terminal intégré
            - Émulation Windows (Wine + Box64)
            - Réseau Tor et navigation .onion
            - Surveillance de sécurité
            - Fausse position GPS

            ### Installation
            1. Télécharge l'APK ci-dessous
            2. Active « Sources inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
