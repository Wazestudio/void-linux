name: Build Void-Linux APK

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # SÉCURITÉ INFRASTRUCTURE : Génération obligatoire du wrapper gradlew pour éviter l'erreur 127
      - name: Generate and Secure Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: core/native/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('core/native/**/*.c', 'core/native/**/*.cpp', 'core/native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            chmod +x tools/generate-mipmaps.sh
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      - name: Download Kali rootfs
        run: |
          if [ -f tools/fetch-kali-rootfs.sh ]; then
            set -e
            chmod +x tools/fetch-kali-rootfs.sh
            bash tools/fetch-kali-rootfs.sh arm64 app/src/main/assets
          else
            echo "::warning::Pas de script fetch-kali-rootfs.sh — skip"
          fi

      # COMPILATION COMPLÈTE : Correction de l'erreur 127 ET acceptation des conditions d'utilisation
      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon --info --scan -Dscan.termsOfUseUrl="https://gradle.com" -Dscan.termsOfUseAgree=yes

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé pour la release !"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ github.ref_name }}
          body: |
            ## Void-Linux ${{ github.ref_name }}
            Environnement hacker tout-en-un sur Android.

            ### Contenu
            - Kali Linux via proot
            - Terminal intégré
            - Émulation Windows (Wine + Box64)
            - Réseau Tor et navigation .onion
            - Surveillance de sécurité
            - Fausse position GPS

            ### Installation
            1. Télécharge l'APK ci-dessous
            2. Active « Sources inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
