name: Build Void-Linux APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ matrix.android-abi }})
    runs-on: ubuntu-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - android-abi: arm64-v8a
          - android-abi: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.1.8937393'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: core/native/.cxx
          key: cmake-${{ runner.os }}-${{ matrix.android-abi }}-${{ hashFiles('core/native/src/main/cpp/**/*.c', 'core/native/src/main/cpp/**/*.cpp', 'core/native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.android-abi }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      - name: Install PRoot packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf dpkg curl

      - name: Prepare official Termux PRoot runtime (${{ matrix.android-abi }})
        run: |
          set -euo pipefail
          bash tools/build-proot.sh "${{ matrix.android-abi }}"
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libproot.so
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libproot_loader.so
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libtalloc.so
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libandroid-shmem.so

      # =========================================================
      # SIGNATURE RELEASE
      # =========================================================
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Le secret GitHub $name est absent; impossible de signer l'APK release."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/void-linux-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          {
            echo "RELEASE_STORE_FILE=$keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate Gradle project structure
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f feature/linux/build.gradle.kts
          test -f core/native/CMakeLists.txt
          if grep -q 'library/proot-engin/proot-engine' settings.gradle.kts; then
            echo "::error::Ancien module PRoot dupliqué détecté dans settings.gradle.kts"
            exit 1
          fi

      - name: Verify requested ABI
        run: |
          set -euo pipefail
          case '${{ matrix.android-abi }}' in arm64-v8a|armeabi-v7a) ;; *) exit 1 ;; esac
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libproot.so
          test -f app/src/main/jniLibs/${{ matrix.android-abi }}/libproot_loader.so

      - name: Build APK (Release)
        run: |
          gradle clean assembleRelease \
            -PtargetAbi="${{ matrix.android-abi }}" \
            -x lint \
            -x lintVitalRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy="in-process"

      - name: Verify release APK signature (${{ matrix.android-abi }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Aucun APK release généré."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release-${{ matrix.android-abi }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error