name: Build Void-Linux APK

on:
  # Déclenchement UNIQUE et STRICTEMENT manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optimisation du cache pour CMake
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: native/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('native/src/main/cpp/**/*.c', 'native/src/main/cpp/**/*.cpp', 'native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      # Optimisation du cache pour l'image Docker de Termux Package Builder
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-termux-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docker-termux-${{ runner.os }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      # Installation explicite de dpkg (fournit dpkg-deb) en plus de patchelf
      - name: Install PRoot packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf dpkg curl

      - name: Build official Termux PRoot (ARM64)
        run: bash tools/build-proot.sh

      - name: Build APKs (Debug & Release)
        run: gradle clean assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé pour la release !"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ github.ref_name }}
          body: |
            ## Void-Linux ${{ github.ref_name }}
            Environnement hacker tout-en-un sur Android.

            ### Contenu
            - Kali Linux via proot
            - Terminal intégré
            - Émulation Windows (Wine + Box64)
            - Réseau Tor et navigation .onion
            - Surveillance de sécurité
            - Fausse position GPS

            ### Installation
            1. Télécharge l'APK ci-dessous
            2. Active « Sources inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
