name: Build Void-Linux APK

on:
  # Déclenchement UNIQUE et STRICTEMENT manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - android-abi: arm64-v8a
          - android-abi: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # CORRECTION CRITIQUE : Installation explicite de CMake et du NDK pour le compilateur C/C++ (Ninja)
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.1.8937393'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optimisation du cache pour CMake
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: native/.cxx
          key: cmake-${{ runner.os }}-${{ matrix.android-abi }}-${{ hashFiles('native/src/main/cpp/**/*.c', 'native/src/main/cpp/**/*.cpp', 'native/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.android-abi }}-

      - name: Generate mipmap icons
        run: |
          if [ -f tools/generate-mipmaps.sh ]; then
            bash tools/generate-mipmaps.sh
          else
            echo "::warning::Pas de script generate-mipmaps.sh — skip"
          fi

      # Outils nécessaires pour empaqueter et vérifier le runtime PRoot officiel
      - name: Install PRoot packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf dpkg curl

      - name: Prepare official Termux PRoot runtime (${{ matrix.android-abi }})
        run: |
          set -euo pipefail
          bash tools/build-proot.sh "${{ matrix.android-abi }}"
          test -x native/src/main/jniLibs/${{ matrix.android-abi }}/libproot.so
          test -f native/src/main/jniLibs/${{ matrix.android-abi }}/libproot_loader.so
          test -f native/src/main/jniLibs/${{ matrix.android-abi }}/libtalloc.so
          test -f native/src/main/jniLibs/${{ matrix.android-abi }}/libandroid-shmem.so

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Le secret GitHub $name est absent; impossible de signer l'APK release."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/void-linux-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          {
            echo "RELEASE_STORE_FILE=$keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate Gradle project structure
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f feature/linux/build.gradle.kts
          test -f native/CMakeLists.txt
          if grep -q 'library/proot-engin/proot-engine' settings.gradle.kts; then
            echo "::error::Ancien module PRoot dupliqué détecté dans settings.gradle.kts"
            exit 1
          fi
          if grep -q '^<\?xml' library/proot-engin/settings.gradle.kts 2>/dev/null; then
            echo "::error::library/proot-engin/settings.gradle.kts contient du XML au lieu de Gradle"
            exit 1
          fi

      - name: Build APK (Release)
        run: gradle clean assembleRelease -PtargetAbi="${{ matrix.android-abi }}" --stacktrace --no-daemon

      - name: Verify release APK signature (${{ matrix.android-abi }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Aucun APK release généré."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-release-${{ matrix.android-abi }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          for artifact in artifacts/void-linux-release-*; do
            abi="${artifact##*void-linux-release-}"
            find "$artifact" -name "*.apk" -exec cp {} "release/void-linux-${abi}.apk" \;
          done
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Aucun APK trouvé pour la release !"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Void-Linux ${{ github.ref_name }}
          body: |
            ## Void-Linux ${{ github.ref_name }}
            Environnement Linux mobile pour l'apprentissage et le diagnostic de sécurité autorisé.

            ### Contenu
            - Terminal PRoot et moteur natif Android
            - APK ARM64 et ARM 32 bits
            - Rootfs Kali téléchargé et vérifié au premier lancement
            - Collections d’outils de diagnostic installables à la demande

            ### Installation
            1. Télécharge l'APK ci-dessous
            2. Active « Sources inconnues » dans les paramètres Android
            3. Installe l'APK
            4. Lance Void-Linux et laisse l'initialisation du rootfs se terminer
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
